name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go build, vet, fmt, test
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate nginx config syntax
        run: |
          docker build -t home-cinema-nginx-ci -f nginx/Dockerfile .
          # Unlike nginx-balancer's vhosts, this config's proxy_pass to
          # "backend" is a literal upstream (no resolver+variable trick),
          # so nginx resolves it at config-load time and refuses to start
          # at all if it can't - which it can't here, outside the compose
          # network. --add-host is enough to satisfy that; nginx -t never
          # actually connects to it.
          docker run --rm --add-host=backend:127.0.0.1 home-cinema-nginx-ci nginx -t

      - name: Validate smb-relay Dockerfile and entrypoint
        run: |
          docker build -t home-cinema-smb-relay-ci ./smb-relay
          sh -n smb-relay/entrypoint.sh

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: home-cinema-backend
            context: ./backend
            file: backend/Dockerfile
          - image: home-cinema-nginx
            context: .
            file: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
