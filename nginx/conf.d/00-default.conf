server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /search can trigger a rutracker login through FlareSolverr, which
        # drives a real browser through a Cloudflare challenge — seen taking
        # 13-39s cold, and Search() may do that twice (retry once on an
        # expired session). 30s cut requests off mid-login, which cascaded:
        # nginx closed the upstream connection, the backend's context got
        # cancelled, and the frontend's automatic retry fired a brand new
        # login on top of the still-settling one.
        proxy_read_timeout 180s;
    }
}
