server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /search can trigger a rutracker login through FlareSolverr, which
        # drives a real browser through a Cloudflare challenge. Search() may
        # do that twice (retry once on an expired session), and each login
        # now waits up to 150s on a slow/CPU-starved host (see
        # flaresolverr.go) — 320s covers two worst-case logins back to back
        # with headroom. A timeout here cascades: nginx closes the upstream
        # connection, the backend's context gets cancelled, and the
        # frontend's automatic retry fires a brand new login on top of the
        # still-settling one.
        proxy_read_timeout 320s;
    }
}
