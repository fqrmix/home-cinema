[global]
workgroup = WORKGROUP
server string = home-cinema smb-relay
security = user
map to guest = Bad User
server min protocol = SMB2
smb ports = 445
log level = 1
pid directory = /run/samba

[relay]
path = /smb
browsable = yes
read only = yes
guest ok = yes
# Samba drops root privileges to the guest account for actual file I/O
# unless told otherwise - the CIFS mount in entrypoint.sh doesn't try to
# match uid/gid to anything in particular, so this is simplest way to
# guarantee read access regardless of what the router's SMB server reports.
force user = root
